name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: rf, POSTGRES_DB: redflag}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: rf, MYSQL_DATABASE: redflag}
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -prf" --health-interval 5s --health-retries 20
    env:
      REDFLAG_TEST_PG_URL: postgresql+psycopg://postgres:rf@localhost:5432/redflag
      REDFLAG_TEST_MYSQL_URL: mysql+pymysql://root:rf@127.0.0.1:3306/redflag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Tests, including the answer log on PostgreSQL and MySQL, MongoDB (mongomock) and S3 (moto)
        run: pytest -q
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Retrieval recall and (if the secret is set) answer accuracy must not regress
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m evals.gate
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t redflag .
      - name: API starts and answers health check (no API key needed)
        run: |
          docker run -d -p 8900:8900 -e REDFLAG_SKIP_SETUP=1 --name rf redflag
          for i in $(seq 1 30); do curl -sf localhost:8900/health && exit 0; sleep 2; done
          docker logs rf; exit 1
  kubernetes:
    name: Deploy to a Kubernetes cluster (kind) and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with: {cluster_name: redflag}
      - name: Build the image and load it into the cluster
        run: |
          docker build -t redflag:ci .
          kind load docker-image redflag:ci --name redflag
      - name: Apply the manifests (Namespace, ConfigMap, Deployment, Service, HPA)
        run: |
          set -o pipefail
          kubectl apply -k k8s/ 2>&1 | tee apply.log || { echo "::error::apply $(paste -sd ' ' apply.log | cut -c1-900)"; exit 1; }
          kubectl -n redflag patch configmap redflag-config --type merge -p '{"data":{"REDFLAG_SKIP_SETUP":"1"}}'
          kubectl -n redflag set image deploy/redflag-api api=redflag:ci
          kubectl -n redflag rollout status deploy/redflag-api --timeout=300s
          kubectl -n redflag get deploy,rs,pods,svc,hpa -o wide
      - name: Both replicas ready, and the Service answers /health
        run: |
          test "$(kubectl -n redflag get deploy redflag-api -o jsonpath='{.status.readyReplicas}')" = "2"
          kubectl -n redflag port-forward svc/redflag-api 8080:80 &
          for i in $(seq 1 20); do curl -sf localhost:8080/health && break; sleep 2; done
          curl -sf localhost:8080/health
      - name: Self healing, a deleted pod is replaced and the Deployment returns to 2 ready replicas
        run: |
          POD="$(kubectl -n redflag get pods -l app=redflag-api -o jsonpath='{.items[0].metadata.name}')"
          kubectl -n redflag delete pod "$POD"
          sleep 5
          kubectl -n redflag wait --for=condition=Ready pod -l app=redflag-api --timeout=180s
          test "$(kubectl -n redflag get deploy redflag-api -o jsonpath='{.status.readyReplicas}')" = "2"
      - name: Diagnostics on failure (also written as annotations)
        if: failure()
        run: |
          kubectl -n redflag get pods -o wide || true
          kubectl -n redflag describe pods | tail -60 || true
          kubectl -n redflag logs -l app=redflag-api --tail=40 || true
          for p in $(kubectl -n redflag get pods -o name); do
            echo "::error::$p $(kubectl -n redflag get "$p" -o jsonpath='{.status.containerStatuses[0].state} last={.status.containerStatuses[0].lastState}' | cut -c1-600)"
          done
          echo "::error::events $(kubectl -n redflag get events --sort-by=.lastTimestamp -o custom-columns=R:.reason,M:.message --no-headers | tail -8 | paste -sd ' ' | cut -c1-900)"
          echo "::error::logs $(kubectl -n redflag logs -l app=redflag-api --tail=15 2>&1 | paste -sd ' ' | cut -c1-900)"
