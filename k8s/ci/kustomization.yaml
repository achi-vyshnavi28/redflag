# CI overlay: the image built in the pipeline, and setup skipped so pods become ready without downloads.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ..
images:
  - {name: redflag, newTag: ci}
patches:
  - target: {kind: ConfigMap, name: redflag-config}
    patch: |
      - op: replace
        path: /data/REDFLAG_SKIP_SETUP
        value: "1"
